<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>무진 그룹사 콘텐츠 어드민</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app" class="app">
        <header class="topbar">
            <div class="topbar-left">
                <button type="button" id="sidebar-toggle" class="icon-btn" title="좌측 패널 토글" aria-label="사이드바 토글">☰</button>
                <h1 class="brand">무진 어드민</h1>
                <a class="site-label" href="https://mujin.im" target="_blank" rel="noopener noreferrer">무진물산 (mujin.im) ↗</a>
            </div>

            <div class="topbar-status">
                <span class="status-pill status-pill-dirty" id="status-dirty">변경 0</span>
                <span class="status-pill status-pill-pending" id="status-pending">미반영 0</span>
                <span class="status-pill status-pill-saved" id="status-saved" hidden>마지막 저장: -</span>
            </div>

            <div class="topbar-right">
                <a href="/manual" class="btn btn-ghost-light btn-manual">사용 매뉴얼</a>
                <button type="button" id="logout-btn" class="btn btn-ghost-light">로그아웃</button>
                <button type="button" id="history-toggle" class="btn btn-ghost-light btn-history">배포 이력</button>
                <button type="button" id="apply-all" class="btn btn-secondary">
                    <span class="text-wide">전체 미리보기 적용</span>
                    <span class="text-narrow">미리보기</span>
                </button>
                <button type="button" id="save-all" class="btn btn-primary" disabled
                        title="저장하면 GitHub에 commit → mujin.im 반영까지 약 1~3분 소요">저장</button>
                <span class="save-hint">≈3분 후 반영</span>
                <a class="btn btn-ghost-light btn-deploy"
                   href="https://dash.cloudflare.com/0130cd9f8e16ebee893cbb47d8af7c0e/pages/view/mujinmoolsan-landing"
                   target="_blank" rel="noopener noreferrer"
                   title="Cloudflare Pages에서 mujin.im 배포 진행상황을 확인하세요. 저장 후 최근 배포에 경과 시간(N minutes ago)이 표시되면 반영 완료입니다.">
                    배포 진행상황 <span aria-hidden="true">↗</span>
                </a>
            </div>
        </header>

        <main class="workspace">
            <aside class="form-panel" id="form-panel">
                <div class="form-panel-inner" id="form-panel-inner">
                    <div class="loading">불러오는 중…</div>
                </div>
            </aside>

            <section class="preview-panel">
                <div class="preview-toolbar">
                    <div class="viewport-toggle" role="group" aria-label="뷰포트 선택">
                        <button type="button" class="vp-btn active" data-vp="pc">PC 1280</button>
                        <button type="button" class="vp-btn" data-vp="mobile">모바일 375</button>
                    </div>
                </div>
                <div class="preview-stage" id="preview-stage">
                    <iframe id="preview-iframe" class="preview-iframe vp-pc" title="미리보기"></iframe>
                </div>
            </section>
        </main>

        <!-- 배포 이력 패널 -->
        <div id="history-panel" class="history-panel" hidden>
            <div class="history-panel-header">
                <span class="history-panel-title">배포 이력 (최근 5개)</span>
                <button type="button" id="history-close" class="icon-btn history-close-btn" aria-label="닫기">✕</button>
            </div>
            <div id="history-list" class="history-list">
                <div class="history-loading">불러오는 중…</div>
            </div>
        </div>
        <div id="history-backdrop" class="history-backdrop" hidden></div>

        <div id="toast" class="toast" hidden></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="app.js" type="module"></script>
</body>
</html>
