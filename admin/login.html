<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>로그인 — 무진 어드민</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --navy:     #0d2137;
            --navy-mid: #1a3a5c;
            --bg:       #f5f7fa;
            --surface:  #ffffff;
            --border:   rgba(13,33,55,0.12);
            --text:     #0d2137;
            --muted:    #7a98b0;
            --danger:   #b04050;
            --radius:   10px;
        }
        html, body {
            height: 100%;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
            font-size: 14px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 4px 24px rgba(13,33,55,0.10);
            padding: 40px 36px 36px;
            width: 100%;
            max-width: 360px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .logo-mark {
            width: 36px;
            height: 36px;
            background: var(--navy);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .logo-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--navy);
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 24px;
            line-height: 1.2;
        }
        .field { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        input {
            display: block;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 14px;
            color: var(--text);
            background: var(--bg);
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus { border-color: var(--navy-mid); background: #fff; }
        .error-msg {
            font-size: 12px;
            color: var(--danger);
            margin-top: 12px;
            min-height: 18px;
        }
        .btn-login {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 11px;
            background: var(--navy);
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-login:hover { background: var(--navy-mid); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-mark">무</div>
            <span class="logo-text">무진 어드민</span>
        </div>
        <h1>로그인</h1>
        <form id="login-form" autocomplete="on">
            <div class="field">
                <label for="username">아이디</label>
                <input id="username" name="username" type="text" autocomplete="username"
                       placeholder="admin" required>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                       placeholder="••••••••" required>
            </div>
            <div class="error-msg" id="error-msg"></div>
            <button type="submit" class="btn-login" id="submit-btn">로그인</button>
        </form>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errEl = document.getElementById('error-msg');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = '로그인 중…';
            errEl.textContent = '';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json();
                if (data.ok) {
                    window.location.replace('/');
                } else {
                    errEl.textContent = data.message || '로그인 실패';
                    btn.disabled = false;
                    btn.textContent = '로그인';
                }
            } catch {
                errEl.textContent = '네트워크 오류가 발생했습니다.';
                btn.disabled = false;
                btn.textContent = '로그인';
            }
        });
    </script>
</body>
</html>
